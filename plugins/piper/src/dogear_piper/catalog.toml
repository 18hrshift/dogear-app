# Piper voices this plugin offers, each file pinned by SHA-256. A download that doesn't
# match is rejected. This is a record of upstream files, not a settings file: choose a
# voice with `--voice piper:NAME` or in [voice] in a settings file.
#
# Chosen on 2026-10-30 from rhasspy/piper-voices, for training data anyone may use:
# public domain, CC0, or CC BY, and trained from scratch (or from another voice here).
# Left out: voices from data licensed for research or non-commercial use only (en_US-ryan,
# en_US-hfc_*, en_GB-semaine, and others), voices whose card says only "See URL", and
# the voices fine-tuned from en_US-lessac, whose Blizzard 2013 recordings are licensed
# only for research into speech technology (among them en_GB-alba, fr_FR-siwis,
# de_DE-thorsten, and es_ES-davefx). See docs/voice-engines.md in Dogear.
#
# Voices are listed best first: Piper's own quality levels, high before medium before
# x_low, then English first. Piper has no ratings of its own.

# About how many words a minute Piper's voices say at speed 1.0, with Dogear's pauses:
# what Dogear estimates a book's length and disk space from before speaking it. Sections 2
# to 6 of Jekyll and Hyde (8,038 words) with en_US-ljspeech-high came to 44.8 minutes, 179
# words a minute.
words_per_minute = 180

# One revision of the repository, so a file can't change under its pin.
base_url = "https://huggingface.co/rhasspy/piper-voices/resolve/b4e358ffcb232591bf73a540e70f7de528e4174a"

[voices.en_US-ljspeech-high]
path = "en/en_US/ljspeech/high"
sample_rate = 22050
language = "en-US"
description = "American English"
gender = "female"
quality = "high"
data = "LJ Speech, public domain. Trained from scratch."
model = { sha256 = "5d4f08ba6a2a48c44592eed3ce56bf85e9de3dd4e20df90541ae68a8310c029a", size = 114199011 }
config = { sha256 = "7e1f4634af596d83cca997fb7a931ba80b70f8a316a2655ee69c55365e0ace14", size = 4970 }

