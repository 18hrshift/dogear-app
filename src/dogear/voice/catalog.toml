# Files Dogear downloads for its built-in voice, each pinned by SHA-256. A download that
# doesn't match is rejected. This is a record of upstream files, not a settings file:
# choose the model and voice in defaults.toml or your own config.

[kokoro]
# Kokoro-82M (Apache-2.0) converted to ONNX, pinned to one revision of the repository.
base_url = "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/1939ad2a8e416c0acfeecc08a694d14ef25f2231"
sample_rate = 24000
max_phonemes = 510  # the model's context, not counting the start and end markers
# About how many words a minute Kokoro says at speed 1.0, with Dogear's pauses: what Dogear
# estimates a book's length from, before speaking it. Jekyll and Hyde (26,328 words) at
# speed 0.9 came to 2 hours 33 minutes, 172 words a minute.
words_per_minute = 190

[kokoro.tokenizer]
path = "tokenizer.json"
sha256 = "77a02c8e164413299b4b4c403b14f8e0e1c1b727db4d46a09d6327b861060a34"
size = 3497

# Builds of the model. Other builds in the repository were left out: q8f16 crashed
# onnxruntime 1.31 on Linux, and the rest were no faster than full on CPU.
[kokoro.models.full]
path = "onnx/model.onnx"
sha256 = "8fbea51ea711f2af382e88c833d9e288c6dc82ce5e98421ea61c058ce21a34cb"
size = 325532232

[kokoro.models.quantized]
path = "onnx/model_quantized.onnx"
sha256 = "fbae9257e1e05ffc727e951ef9b9c98418e6d79f1c9b6b13bd59f5c9028a1478"
size = 92361116

# English voices, with the overall grade from Kokoro's VOICES.md (A is best). Each file
