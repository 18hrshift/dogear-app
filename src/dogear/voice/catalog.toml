[spacy]
# spaCy's small English model (MIT), used to tag words so heteronyms such as "read" and
# "lead" get the right pronunciation. Downloaded as a wheel; only the model folder is kept.
url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
sha256 = "1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
size = 12806118
model_dir = "en_core_web_sm/en_core_web_sm-3.8.0"
# The model folder once unpacked, for `dogear download --check`: the SHA-256 of a line per
# file, "<SHA-256>  <path in the folder>", sorted by path (downloads.folder_sha256).
