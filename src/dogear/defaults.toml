# Dogear default settings. This file is the single source of truth for defaults.
# A user config file overrides any of these keys; unknown keys are rejected.

[pdf]
# Chapter detection methods, tried in order. The first one that finds two or more
# chapters wins. Options: bookmarks, chapter_dividers, font_size, pattern, page_split.
chapter_detection = ["bookmarks", "chapter_dividers", "font_size", "pattern", "page_split"]
# Pages per section when falling back to page_split.
page_split_size = 20
# A line counts as a heading when its font is this many times larger than body text.
heading_size_ratio = 1.4
# Inside a chapter, up to three lines at least this many times larger than body text,
# or bold where body text isn't, are a subheading. Subheading styles are ranked across
# the book, largest first, as heading levels 2 to 6.
subheading_size_ratio = 1.15
# If pages average fewer text characters than this, the PDF is treated as scanned.
min_chars_per_page = 25
# true: a scanned PDF is read with OCR first, with Tesseract on this computer (see [ocr]),
# which takes a while: often a few seconds a page. The pages read are kept in the cache
# folder ([render] cache_dir), so stopping part way loses nothing, and reading the same
# file again needs no OCR. Tesseract must be installed: Dogear's installers don't include
# it, and the Docker image does. false: Dogear stops at a scanned PDF and says so.
auto_ocr = true
# A page's top or bottom line is a running header or footer (and removed) when the same
# text, ignoring digits and case, opens or closes at least this many pages...
running_line_min_pages = 3
# ...and at least this share of the pages between its first and last appearance.
running_line_min_share = 0.4
# A running header or footer can be up to this many lines deep, such as the book's title
# with the chapter's title under it. Each line must repeat on its own to be removed.
running_line_max_lines = 2
# Pages set in columns are read one column at a time, top to bottom, left to right.
# Lines that cross the space between columns, such as a title above them, are read
# where they sit. A column gutter is a gap at least this many times the size of the
# page's main font...
column_gap_ratio = 0.8
# ...with at least this many lines on each side of it...
column_min_lines = 3
# ...and each side at least this many times the main font size wide, so the page numbers
# down the side of a table of contents stay beside their titles.
column_min_width_ratio = 8.0
# Images covering at least this share of the page are read as images (with no
# description: a PDF rarely has one); smaller ones are taken as decoration and skipped.
# 0.02 is a picture about 1.4 inches (3.5 cm) square on a US Letter or A4 page.
image_min_page_share = 0.02
# Footnotes at the foot of a page are read as notes, and their markers in the text are
# taken out and linked to them. A marker is a digit or a note symbol (* † ‡ § ¶ ‖) set
# small and raised at least this many times the line's font size above the line's letters.
note_marker_rise_ratio = 0.15
# A new paragraph starts where the space between two lines is this many times the usual
# line spacing.
paragraph_gap_ratio = 1.3
# A new paragraph starts where a line is indented at least this many times the body font
# size from the page's left margin.
paragraph_indent_ratio = 0.7
# A hyphen at a line end before a lowercase letter is either a break inside a word
# ("exam-" + "ple") or part of a compound ("well-" + "known"). The book decides: whichever
# spelling, "example" or "well-known", appears more often elsewhere in it wins, if it
# appears at least this many times...
hyphen_evidence_min = 1
# ...and with no evidence either way: "join" (most line-end hyphens are the typesetter's)
# or "keep".
hyphen_without_evidence = "join"

[epub]
# Largest size, in megabytes, that one file inside an EPUB may unpack to (zip-bomb guard).
# Applies to the cover image too.
max_member_mb = 64
# Each table-of-contents entry at most this many levels deep starts a new section (one
# audio track). 2 suits a contents of Parts and Chapters: every chapter gets its own track,
# and a Part's own pages (its title, an epigraph) get a short one. Use 1 when the second
# level lists sections within chapters. 0 ignores the table of contents and makes one
# section per file.
toc_depth = 2

# HTML, Markdown, and Word books have no table of contents, so each is cut into sections
# at its top heading level: the highest level used more than once. A title heading used
# once above the chapters gets a short section of its own, and each chapter gets one.

[docx]
# Largest size, in megabytes, that one part of a Word document may unpack to (zip-bomb
# guard). The text of a long novel is under 5 MB.
max_member_mb = 64

[html]
# Largest HTML file Dogear reads, in megabytes. A long novel is under 5 MB of HTML.
# Reading HTML takes about 50 times the file's size in memory (16 MB took about 870 MB),
# so a larger limit could exhaust an ordinary computer's memory.
max_file_mb = 16

[markdown]
# Largest Markdown file Dogear reads, in megabytes. A long novel is under 3 MB.
max_file_mb = 32
# Most lines a Markdown file may have: reading one takes memory for each line, even a
# blank one. A 3 MB novel hard-wrapped at 72 characters has under 60,000.
max_lines = 500000
# Most pieces a Markdown file may be read into, each paragraph, heading, list item,
# table cell, line break, link, and stretch of text or emphasis being one or a few. The
# same 3 MB novel is about 120,000. A table's rows are filled out to its header's width,
# so without this a small file with a wide table could fill the memory.
max_pieces = 1000000

[ocr]
# How scanned PDFs are read with OCR: by itself when [pdf] auto_ocr is true, and by
# `dogear ocr`. Changing any of these, or updating Tesseract or a language pack, reads a
# scanned PDF again rather than using the text kept from an earlier read.
# Each page is drawn as a picture at this resolution for Tesseract. 300 suits print; 70
# is the least Tesseract takes.
dpi = 300
# Tesseract language code(s), such as "eng" or "eng+fra". Each needs Tesseract's language
# pack for it; `tesseract --list-langs` lists the ones installed.
language = "eng"
# A page whose picture at that resolution would be bigger than this many megapixels is
# drawn at a lower resolution, so a PDF can't make Dogear fill the computer's memory with
# one page. A book page at 300 dpi is about 8 megapixels; 100 is a page about 33 inches
# (85 cm) square.
max_page_megapixels = 100
# So is a page whose picture would be wider or taller than this many pixels. 32767 is the
# most Tesseract reads; at 300 dpi it is a page about 9 feet (2.8 m) long. A page that
# would have to be drawn at less than 70 dpi, the least Tesseract reads, to fit both
# limits isn't read at all: Dogear stops and says which page it is.
max_page_side_pixels = 32767

[speech]
# Longest piece of text sent to a voice engine at once. Longer sentences are split at
# commas, semicolons, or colons first.
max_sentence_chars = 400
# A period after these never ends a sentence. Titles before names (the table below)
# and single initials such as "J." are also never sentence ends.
no_sentence_break_after = ["e.g.", "i.e.", "vs.", "viz.", "cf."]
# A roman numeral right after one of these words is read as a number: "Chapter IV" is
# "Chapter four". Each word matches as written here and in capitals ("CHAPTER IV").
# Headings that are only a numeral ("IV.") are read as numbers too. English only.
roman_numeral_keywords = [
    "Chapter", "Part", "Book", "Volume", "Act", "Scene", "Section", "Canto", "Letter",
    "Appendix", "Stave", "Psalm", "Sonnet", "Article",
]

# Always expanded.
[speech.abbreviations]
"etc." = "et cetera"  # two words: the voice's dictionary has no "etcetera"
"vs." = "versus"
"e.g." = "for example"
"i.e." = "that is"
"viz." = "namely"
"approx." = "approximately"

# Expanded only before a capitalized word, so "Elm Dr." stays put.
[speech.abbreviations_before_name]
"Dr." = "Doctor"
"Mr." = "Mister"
"Mrs." = "Missus"
"Ms." = "Miz"
"Prof." = "Professor"
"St." = "Saint"
"Mt." = "Mount"
"Gov." = "Governor"
"Gen." = "General"
"Lt." = "Lieutenant"
"Col." = "Colonel"
"Capt." = "Captain"
"Sgt." = "Sergeant"
"Cpl." = "Corporal"
"Pvt." = "Private"
"Rev." = "Reverend"
"Hon." = "Honorable"

# Expanded only before a number, so "He said no." stays put.
[speech.abbreviations_before_number]
"No." = "number"
"no." = "number"
"Nos." = "numbers"
"p." = "page"
"pp." = "pages"
"vol." = "volume"
"Vol." = "volume"
"ch." = "chapter"
"Ch." = "chapter"
"fig." = "figure"
"Fig." = "figure"

# Every table in [speech], above and below, is English only: Dogear spells out numbers,
# abbreviations, and symbols in English text only, and leaves other languages' text for
# their voices to read as written.

# What follows a clock time ("3:30 pm", "10 a.m."), matched in any case, and how to say it.
[speech.time_suffixes]
"am" = "a.m."
"a.m." = "a.m."
"pm" = "p.m."
"p.m." = "p.m."

# Currency symbols written before an amount, as [singular, plural]: "$1" is "one dollar",
# "$5" is "five dollars".
[speech.currency]
"$" = ["dollar", "dollars"]
"£" = ["pound", "pounds"]
"€" = ["euro", "euros"]
"¥" = ["yen", "yen"]
"₹" = ["rupee", "rupees"]

# The hundredth part of a currency above, for amounts with two decimal places: "$5.99" is
# "five dollars and ninety-nine cents". A currency missing here reads "¥5.99" as "five
# point nine nine yen".
[speech.currency_cents]
"$" = ["cent", "cents"]
"£" = ["penny", "pence"]
"€" = ["cent", "cents"]
"₹" = ["paisa", "paise"]

# Words for large amounts after a currency, matched in any case: "$1.5 million" is "one
# point five million dollars", "£5m" is "five million pounds".
[speech.currency_scales]
"thousand" = "thousand"
"million" = "million"
"billion" = "billion"
"trillion" = "trillion"
"k" = "thousand"
"m" = "million"
"bn" = "billion"
"b" = "billion"
"tn" = "trillion"

# Units written after a number, as [singular, plural]: "1 km" is "one kilometer", "1.5 km"
# is "one point five kilometers". Units that misfire in prose are left out on purpose:
# "in" ("5 in the morning"), "m" (meters or minutes), "s", "l", "t", and "pt".
[speech.units]
"%" = ["percent", "percent"]
"°" = ["degree", "degrees"]
"°C" = ["degree Celsius", "degrees Celsius"]
"°F" = ["degree Fahrenheit", "degrees Fahrenheit"]
"¢" = ["cent", "cents"]
"mm" = ["millimeter", "millimeters"]
"cm" = ["centimeter", "centimeters"]
"km" = ["kilometer", "kilometers"]
"m²" = ["square meter", "square meters"]
"km²" = ["square kilometer", "square kilometers"]
"ft" = ["foot", "feet"]
"ft." = ["foot", "feet"]
"yd" = ["yard", "yards"]
"yd." = ["yard", "yards"]
"mi" = ["mile", "miles"]
"mg" = ["milligram", "milligrams"]
"g" = ["gram", "grams"]
"kg" = ["kilogram", "kilograms"]
"oz" = ["ounce", "ounces"]
"oz." = ["ounce", "ounces"]
"lb" = ["pound", "pounds"]
"lb." = ["pound", "pounds"]
"lbs" = ["pound", "pounds"]
"lbs." = ["pound", "pounds"]
"ml" = ["milliliter", "milliliters"]
"mL" = ["milliliter", "milliliters"]
"fl oz" = ["fluid ounce", "fluid ounces"]
"tsp" = ["teaspoon", "teaspoons"]
"tbsp" = ["tablespoon", "tablespoons"]
"qt" = ["quart", "quarts"]
"gal" = ["gallon", "gallons"]
"mph" = ["mile per hour", "miles per hour"]
"km/h" = ["kilometer per hour", "kilometers per hour"]
"kph" = ["kilometer per hour", "kilometers per hour"]

[pronunciation]
# Your own pronunciation files, for names, places, and other words the voice says wrong.
# Each file lists words and how to say them; the README explains how to write one. Give
# each file's full path in quotes, such as "~/books/words.toml" (~ is your home folder)
# or "C:/Users/me/words.toml". List as many as you like, separated by commas. When two
# files list the same word, the one later in the list wins. To add a file for one run
# only, use --words FILE with `dogear make`, `text`, `words`, or `say`.
files = []

[audio]
mp3_quality = 4      # libmp3lame VBR quality: 0 is best, 9 is smallest
m4b_bitrate = "128k"
# Talking books (EPUB and DAISY) use constant-bitrate mono MP3, which every DAISY player
# can play. 64k keeps a voice clear at about 29 MB an hour; 48k is smaller.
talking_book_bitrate = "64k"
# Each chapter is turned up or down by one fixed amount (linear gain, so nothing pumps)
# to land at this integrated loudness. -20 LUFS sits inside the -18 to -23 dB RMS range
# ACX (Audible) asks of audiobooks. Kokoro's peaks are high for its loudness: its
# chapters measured about -22 LUFS with peaks near 0 dB, so reaching -18 under the -3 dB
# ceiling took about 7 dB of limiting per chapter, where -20 takes about 5.
loudness_target_lufs = -20.0
# No peak may go above this, measured as true peak (including peaks between samples).
# -3 dBTP matches ACX's peak limit and leaves headroom for the small overshoot that MP3
# and AAC encoding add.
true_peak_ceiling_dbtp = -3.0
# When reaching the target would push peaks over the ceiling, a limiter shaves them off,
# by at most this many dB. Brief peaks (plosives, clicks) lose a few dB without audible
# change; past this, the chapter is left quieter than the target instead, with a warning.
max_limiting_db = 7.0
# A chapter measuring quieter than this (or too short to measure) is treated as silence
# and left as it is, so near-silence is never boosted into audible noise.
silence_threshold_lufs = -50.0

[kindle]
# Converting a Kindle book with Calibre stops after this many seconds.
convert_timeout_seconds = 600

[tools]
# Command name or full path for each external program.
# An empty value means: use the copy that came with Dogear's installer, if there is one,
# else search PATH, then common install locations.
ffmpeg = ""
ffprobe = ""
tesseract = ""
ebook_convert = ""
espeak_ng = ""

[voice]
# The voice engine, and one of its voices. `dogear voices` lists every installed engine
# and its voices. Kokoro comes with Dogear; others are installed as plugins.
engine = "kokoro"
voice = "af_heart"
# Speaking pace: 1.0 is the voice's natural pace. Kokoro at 1.0 read a test chapter at
# about 190 words a minute; audiobook narrators average nearer 155, so the default is a
# little slower. Players can change speed too.
speed = 0.9
# Some voice engines are speech services on another computer, such as one on the
# internet (cloud voices): the text they speak is sent there, sentence by sentence, and
# the service's own terms apply. Dogear uses such a voice only when this is true, or with
# --allow-cloud for one run, and it says where the text goes before sending any. The web
# page lists them only when this is true. A server on this computer doesn't count.
allow_cloud = false

# The voice above is the book's main voice. A passage in another language (one the book
# marks, or one [language_detection] finds) is read by the voice [voice.languages] gives
# that language. This decides a language that table doesn't list and the main voice
# doesn't speak:
#   "main": the main voice reads it anyway, as an English voice reading a French phrase.
#   "best": the best installed voice for the language reads it, if there is one: the
#           main voice's engine first, then the others as `dogear voices` lists them,
#           each engine's voices best first, but never a voice that sends text off this
#           computer (name one below to use it). Without one, the main voice reads it.
# "main" is the default. Only the Piper plugin has voices in other languages so far, and
# it isn't installed with Dogear. A change of voice in the middle of a chapter is
# jarring, the voices of another engine sound different, and books are sometimes marked
# with the wrong language: a stray change of voice is worse than an English voice
# reading a French phrase. Choose a voice per language below, or "best", to change it.
other_languages = "main"

# The voice for each language, as engine:voice, such as fr = "piper:fr_FR-mls-medium".
# A language is a BCP 47 tag: "fr" is every kind of French, and "fr-CA" Canadian French
# only. The most specific one that matches a passage wins. Each voice must speak the
# language it is given (its own language's first part, such as fr, must match). Empty
# by default: every passage is read by the main voice.
[voice.languages]

[language_detection]
# Many books don't mark the passages in another language. With this on, Dogear guesses
# them, on this computer, with a small language identifier (py3langid). It looks only
# for languages it has a voice to read (in [voice.languages], the main voice's, and with
# other_languages = "best" every installed voice's), and never changes a language the
# book marks on a passage or on its chapter. Off by default: a wrong guess changes the
# voice in the middle of a chapter, and books that mark their languages need no guessing.
enabled = false
# Each paragraph, list, note, table, and heading is checked as a whole, if it has at
# least this many letters. Shorter text ("Oui, monsieur.") is too easily mistaken.
min_letters = 30
# A guess is used only when the identifier is at least this sure of it, from 0 to 1. On
# Jekyll and Hyde, nothing of 30 letters or more was guessed to be in another language;
# French sentences of 39 to 66 letters came out French at 0.99 or more.
min_confidence = 0.9
# A paragraph or note with at least this many letters is also checked a sentence at a
# time, so a quotation inside it is found. Each sentence needs min_letters as well.
sentence_check_min_letters = 300

# Each voice engine has a settings table of its own, named after it, such as [kokoro].
# Its defaults come with the engine: Kokoro's are in voice/kokoro.toml, next to this file.

[models]
# Where downloaded voice files are kept. Empty means the usual per-user data folder.
# Dogear's installers carry the default voice inside the app, so it isn't downloaded.
dir = ""
download_timeout_seconds = 60

[narration]
# How notes are read. "after_paragraph": right after the paragraph that refers to them.
# "end_of_section": together, at the end of the chapter. "where_printed": wherever they
# sit in the book. "skip": not read.
footnotes = "after_paragraph"
# Tables: "read" goes row by row, saying each column's heading before its value.
# "skip" says that a table was left out.
tables = "read"
# Images with a description are read as "Image: ..." and decorative images are never
# read. This decides images that came with no description: true says "Image.", false
# says nothing. A caption is always read.
announce_undescribed_images = false
# Say "Page 42" where each print page begins, for listeners following a print copy.
announce_pages = false
# Start with a short track that says the book's title and who wrote it, unless the book
# opens with its own title page. Talking books (EPUB and DAISY) open on it too, as their
# players expect.
announce_title = true

# Silence, in milliseconds. Longer pauses mark bigger breaks, so a listener hears the
# structure.
[narration.pauses]
sentence_ms = 300
paragraph_ms = 700
heading_ms = 1000  # after a heading
list_item_ms = 400
scene_break_ms = 1800
section_start_ms = 500  # before the first words of each track
section_end_ms = 2000  # after the last words of each track

# Words Dogear adds when it reads structure aloud, in English. Passages and books in
# another language use that language's table below (the most specific match, so "fr"
# covers fr-CA), or these English words when it has none, which `dogear make` says.
# To add a language, add a table named after it, such as [narration.words.it]; a word it
# leaves out is said in English.
[narration.words]
image = "Image"
note = "Note"
notes = "Notes"
table = "Table"
row = "Row"
page = "Page"
table_skipped = "Table not read."
by = "By"  # the title track: "By Robert Louis Stevenson."
and = "and"  # "By Ann Smith and Bob Jones."

[narration.words.fr]
image = "Image"
note = "Note"
notes = "Notes"
table = "Tableau"
row = "Ligne"
page = "Page"
table_skipped = "Tableau non lu."
by = "Par"
and = "et"

[narration.words.de]
image = "Bild"
note = "Anmerkung"
notes = "Anmerkungen"
table = "Tabelle"
row = "Zeile"
page = "Seite"
table_skipped = "Tabelle nicht vorgelesen."
by = "Von"
and = "und"

[narration.words.es]
image = "Imagen"
note = "Nota"
notes = "Notas"
table = "Tabla"
row = "Fila"
page = "Página"
table_skipped = "Tabla no leída."
by = "Por"
and = "y"

[render]
# Where rendered sentences, and the text read from scanned PDFs with OCR, are kept so
# later runs reuse them. Empty means the usual per-user cache folder. Safe to delete; the
# next run just takes longer.
cache_dir = ""
# Longest gap, in seconds, between progress lines while a long section is being spoken.
progress_every_seconds = 120
# Voices pad their sentences with different amounts of quiet. Sound below this level
# (dB below full scale) at the start and end of a sentence is trimmed, keeping a little
# so word edges aren't clipped; the pauses above then set the spacing.
edge_silence_db = -50.0
edge_silence_keep_ms = 60

[output]
# What `dogear make` produces, one or more of: "m4b" (one audiobook file with chapters),
# "mp3" (a folder of numbered MP3 files with a playlist), "epub" (an EPUB 3 talking book:
# the text and the audio in step, for reading apps such as Thorium Reader), and "daisy"
# (a DAISY 2.02 talking book, for DAISY players and apps).
formats = ["m4b"]
# Before speaking, `dogear make` estimates the disk space the book needs, and stops if a
# disk doesn't have it: the speech cache and the run's work folder (on the disk that holds
# render.cache_dir) and what it saves (on the output folder's disk). The estimate is raised
# by this many percent, for voices and books that come out longer than average, and so a
# disk is never filled to the last byte. 0 uses the estimate as it is.
space_margin_percent = 20

[web]
# `dogear serve`: make books from a web browser, on this computer or (with --lan) from a
# phone or another computer on the same network.
# The port the page is served on. --port changes it for one run.
port = 8765
# With --lan, also show a link for phones and other computers, with this computer's address
# on the network as Dogear finds it. Inside a container (Docker), the address it finds is
# the container's own, which other devices can't reach: set this to false there, and Dogear
# says to use this computer's network address in place of 127.0.0.1 instead.
show_network_address = true
# Largest book file the page accepts, in megabytes. Most EPUB and Kindle books are under
# 20 MB, and a long PDF with pictures can reach 100 to 200 MB. 200 lets nearly any book
# in while keeping one upload from filling the disk.
max_upload_mb = 200
# Reading a book to list its sections stops once Dogear has gone this many seconds
# without reporting any progress, and is then taken to be stuck. The count starts again
# with each progress line, so a long job that keeps reporting is never cut short: a
# scanned PDF is read with OCR first, a few seconds a page, and says how far it has got
# every few pages. A limit on the whole read would stop a long scanned book half way, or
# be too long to catch a read that is stuck. Kindle books are converted with Calibre
# first, which reports nothing until it's done and can take up to
# kindle.convert_timeout_seconds. The same limit applies to checking a book's words and
# to saying something for Listen (the first Listen may download the voice, which reports
# as it goes).
read_timeout_seconds = 900
# Where uploaded books, everything made from them, and the page's access key are kept.
# Empty means a folder named web in the usual per-user data folder. Each book has its own
# folder, deleted with it.
dir = ""
# The page keeps the words fixed on it in its own pronunciation file, words.toml in the
# folder above, and uses it for every book it makes, after the files in
# pronunciation.files, so its entries win. The page saves at most this many words...
max_pronunciations = 1000
# ...each at most this many characters long, as the book writes it...
max_word_chars = 80
# ...and each spelling (such as "utter son" for Utterson) at most this many characters.
max_spelling_chars = 160
# A book's "Check how words are said" page lists the 50 words the voice doesn't know that
# come up most often, with a link to the rest: at most this many, most frequent first.
# Each is a field with a Listen button, so a longer list makes a longer page.
max_words_listed = 500
