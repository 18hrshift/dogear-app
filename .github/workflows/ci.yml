name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      # Tests that need these programs fail instead of skipping, so a broken runner
      # can't quietly skip whole areas. Calibre isn't installed here; its test skips.
      DOGEAR_REQUIRE_TOOLS: ffmpeg,ffprobe,tesseract,espeak-ng
    steps:
      # Actions are pinned to commit SHAs; the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg, Tesseract, and eSpeak NG
        timeout-minutes: 10
        uses: ./.github/actions/install-tools
      - name: Lint and test
        shell: bash
        run: bash test.sh

  voice:
    # The real voice, start to finish: download (cached between runs), speak two short
    # sections of a public-domain book, and package them.
    name: Real voice, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Install ffmpeg, Tesseract, and eSpeak NG
        timeout-minutes: 10
        uses: ./.github/actions/install-tools
      - name: Restore the voice files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dogear-models
          key: dogear-models-${{ runner.os }}-${{ hashFiles('src/dogear/voice/catalog.toml') }}
      - name: Make a short audiobook
        timeout-minutes: 15
        shell: bash
        run: |
          printf "[models]\ndir = '%s'\n" "${{ runner.temp }}/dogear-models" > voice.toml
          uv run --frozen dogear make tests/fixtures/*.epub --config voice.toml \
            --sections 1-2 --format m4b,mp3 -o out
      - name: Check the output
        shell: bash
        run: |
          chapters=$(ffprobe -v error -show_chapters -of csv=p=0 out/*.m4b | wc -l)
          echo "M4B chapters: $chapters"
          # Section 1 is the book's own title page, so there is no separate title track.
          test "$chapters" -eq 2
          ls out/*MP3*

  piper:
    # The Piper voice engine plugin (plugins/piper), installed beside Dogear: its own tests,
    # one of them with a real Piper voice (downloaded once, cached between runs), then a
    # short audiobook spoken with that voice. piper-tts has wheels for all three systems.
    name: Piper plugin, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Install ffmpeg, Tesseract, and eSpeak NG
        timeout-minutes: 10
        uses: ./.github/actions/install-tools
      - name: Restore the Piper voice
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dogear-piper-models
          key: dogear-piper-models-${{ runner.os }}-${{ hashFiles('plugins/piper/src/dogear_piper/catalog.toml') }}
      - name: Download the voice
        timeout-minutes: 10
        shell: bash
        run: |
          printf "[models]\ndir = '%s'\n" "${{ runner.temp }}/dogear-piper-models" > voice.toml
          uv run --frozen --with-editable ./plugins/piper \
            dogear download --config voice.toml --voice piper:en_US-ljspeech-high
      - name: Test the plugin
        shell: bash
        env:
          DOGEAR_PIPER_TEST_MODELS: ${{ runner.temp }}/dogear-piper-models
        run: uv run --frozen --with-editable ./plugins/piper pytest plugins/piper/tests
      - name: Make a short audiobook
        timeout-minutes: 15
        shell: bash
        run: |
          uv run --frozen --with-editable ./plugins/piper dogear make tests/fixtures/*.epub \
            --config voice.toml --voice piper:en_US-ljspeech-high --sections 1-2 --format m4b -o out
      - name: Check the output
        shell: bash
        run: |
          chapters=$(ffprobe -v error -show_chapters -of csv=p=0 out/*.m4b | wc -l)
          echo "M4B chapters: $chapters"
          # Section 1 is the book's own title page, so there is no separate title track.
          test "$chapters" -eq 2

  openai-speech:
    # The speech service plugin (plugins/openai_speech), installed beside Dogear: its own
    # tests, against a fake speech service on the runner, one of them making a short
    # audiobook through it. No network service is called and no key is needed, so the job
    # has no secrets.
    name: Speech service plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOGEAR_REQUIRE_TOOLS: ffmpeg,ffprobe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Install ffmpeg, Tesseract, and eSpeak NG
        timeout-minutes: 10
        uses: ./.github/actions/install-tools
      - name: Test the plugin
        shell: bash
        run: uv run --frozen --with-editable ./plugins/openai_speech pytest plugins/openai_speech/tests

  talking-books:
    # Talking books checked by the standard validators: EPUBCheck and Ace by DAISY for
    # EPUB 3, DAISY Pipeline 2 for DAISY 2.02. Two sections of the fixture, spoken with
    # the real voice, plus sample books with a humming fake voice that between them use
    # every kind of block and every narration choice.
    name: Talking books
    # Not ubuntu-latest: on Ubuntu 26.04 runners, DAISY Pipeline 2's command-line client (a
    # 32-bit Go program in its Docker image) can't open a socket ("function not
    # implemented"), so no book can be sent to the validator. 24.04 runs it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Install ffmpeg, Tesseract, and eSpeak NG
        timeout-minutes: 10
        uses: ./.github/actions/install-tools
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Restore the voice files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dogear-models
          key: dogear-models-${{ runner.os }}-${{ hashFiles('src/dogear/voice/catalog.toml') }}
      - name: Restore EPUBCheck and Ace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dogear-validators
            ~/.cache/puppeteer
          key: dogear-validators-${{ runner.os }}-${{ hashFiles('scripts/check-epub.sh') }}
      - name: Make talking books
        timeout-minutes: 15
        shell: bash
        run: |
          printf "[models]\ndir = '%s'\n" "${{ runner.temp }}/dogear-models" > voice.toml
          uv run --frozen dogear make tests/fixtures/*.epub --config voice.toml \
            --sections 1-3 --format epub,daisy -o out
          uv run --frozen python scripts/make-sample-epub.py out/epub-samples
          uv run --frozen python tests/daisy_samples.py out/daisy-samples
      - name: Check the EPUB books
        shell: bash
        run: |
          for book in out/*.epub out/epub-samples/*.epub; do
            bash scripts/check-epub.sh "$book"
          done
      - name: Check the DAISY books
        shell: bash
        run: bash scripts/check-daisy.sh out/*DAISY out/daisy-samples/*/*DAISY
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talking-book-reports
          path: |
            out/**/*.epubcheck.json
            out/**/*.ace
            out/**/*validation report.html
          if-no-files-found: ignore

  web-a11y:
    # Every page of `dogear serve`, in every state, made with test data and checked with
    # axe-core in a real browser at desktop width and at 320 pixels, in light and dark.
    name: Web accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Restore Playwright, its browser, and axe-core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dogear-validators
          key: dogear-web-a11y-${{ runner.os }}-${{ hashFiles('scripts/check-web-a11y.sh') }}
      - name: Check the web pages
        shell: bash
        env:
          # The browser's system libraries aren't cached, so they're installed each run.
          DOGEAR_A11Y_INSTALL_DEPS: "1"
        run: bash scripts/check-web-a11y.sh out/web-pages
      - name: Keep the pages and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-accessibility-report
          path: out/web-pages
          if-no-files-found: ignore
