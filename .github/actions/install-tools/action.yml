name: Install external programs
description: ffmpeg, Tesseract, and eSpeak NG, the programs Dogear runs, on Linux, macOS, or Windows.

runs:
  using: composite
  steps:
    - name: Install (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Skip the man-db index rebuild, which can stall apt on hosted runners.
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends \
          ffmpeg tesseract-ocr tesseract-ocr-eng espeak-ng
    - name: Install (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ffmpeg tesseract espeak-ng
    - name: Install (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install -y --no-progress ffmpeg
    # Tesseract comes from its Windows builders' own release rather than Chocolatey, whose
    # feed once answered 406 for it while reporting success. Pinned by SHA-256.
    - name: Install Tesseract (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = Join-Path $env:RUNNER_TEMP "tesseract-setup.exe"
        $url = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe"
        Invoke-WebRequest -Uri $url -OutFile $exe -MaximumRetryCount 3
        $expected = "C885FFF6998E0608BA4BB8AB51436E1C6775C2BAFC2559A19B423E18678B60C9"
        if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $expected) { throw "Tesseract installer checksum mismatch" }
        $dir = "C:\Program Files\Tesseract-OCR"
        Start-Process -FilePath $exe -ArgumentList "/S", "/D=$dir" -Wait -NoNewWindow
        if (-not (Test-Path "$dir\tesseract.exe")) { throw "Tesseract did not install to $dir" }
        Add-Content -Path $env:GITHUB_PATH -Value $dir
    # eSpeak NG comes from its own release rather than Chocolatey, whose feed failed for
    # it in one of two parallel jobs. The installer is pinned by SHA-256.
    - name: Install eSpeak NG (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $msi = Join-Path $env:RUNNER_TEMP "espeak-ng.msi"
        $url = "https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi"
        Invoke-WebRequest -Uri $url -OutFile $msi -MaximumRetryCount 3
        $expected = "7F673C709EA5DD579D3B5EBB98688CC575328A6AB7438D2BC405B88CEDAEAFB9"
        if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $expected) { throw "espeak-ng.msi checksum mismatch" }
        Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart" -Wait -NoNewWindow
        $dir = "C:\Program Files\eSpeak NG"
        if (-not (Test-Path "$dir\espeak-ng.exe")) { throw "eSpeak NG did not install to $dir" }
        Add-Content -Path $env:GITHUB_PATH -Value $dir
    # Every program is checked here, so a failed install stops the job with its name
    # instead of surfacing later as failing tests.
    - name: Check every program is on PATH
      shell: bash
      run: |
        for program in ffmpeg ffprobe tesseract espeak-ng; do
          command -v "$program" >/dev/null || { echo "$program was not installed"; exit 1; }
          echo "$program: $(command -v "$program")"
        done
